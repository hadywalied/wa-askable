name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Signed installers cannot be cross-compiled: macOS builds on macOS, Windows on
# Windows. That is the whole reason this matrix exists. See PLAN.md §4 Phase 4.

jobs:
  check:
    uses: ./.github/workflows/checks.yml

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile
      - run: bun run setup

      # electron-builder is invoked directly rather than through `bun run dist:x --`:
      # bun forwards the `--` separator itself, electron-builder then reads the
      # leftovers as positional file paths and dies with "<cwd> not a file".
      # Linux and Windows tolerated it; macOS did not.
      #
      # --publish never: this workflow proves the installers build, it does not
      # ship them. release.yml is the only thing that uploads.
      - name: build installers
        run: |
          bun run build
          npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing secrets are deliberately NOT passed while none exist. An
          # empty CSC_LINK is still "defined", and electron-builder then tries to
          # read it as a certificate path and dies with "<cwd> not a file".
          # Add them back here alongside removing `identity: null` from
          # electron-builder.yml once there is a certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: wa-askable-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
