name: release

# Tag a version to ship it:
#   npm version patch   (or edit package.json)
#   git tag v0.1.1 && git push origin v0.1.1
#
# Produces a DRAFT GitHub release with installers for all three platforms
# attached. Draft on purpose — a human reads the notes and presses publish, so a
# mistyped tag is not immediately a download people can install.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Same definition CI runs on every push. A release cannot ship something that
  # was verified differently.
  check:
    uses: ./.github/workflows/checks.yml

  publish:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile
      - run: bun run setup

      # Invoked directly, not via `bun run dist:x --` — see build.yml.
      - name: build and publish installers
        run: |
          bun run build
          npx electron-builder --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is applied only when these exist. Without them the artifacts
          # are unsigned but valid: macOS users will see a Gatekeeper warning,
          # Windows users a SmartScreen one.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Belt and braces: if electron-builder's publisher is ever misconfigured,
      # the binaries are still retrievable from the run itself.
      - uses: actions/upload-artifact@v4
        with:
          name: wa-askable-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
